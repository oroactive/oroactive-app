services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://oroactive_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obbligatoria}@postgres:5432/oroactive_db
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obbligatoria}
      JWT_EXPIRES_IN: 7d
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-app.oroactive.it}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-https://app.oroactive.it}
      AURUM_MEMORY_ENCRYPTION_KEY: ${AURUM_MEMORY_ENCRYPTION_KEY:-}
      AURUM_MEMORY_ENCRYPTION_KEY_PREVIOUS: ${AURUM_MEMORY_ENCRYPTION_KEY_PREVIOUS:-}
      DATABASE_MIGRATION_TIMEOUT_MS: ${DATABASE_MIGRATION_TIMEOUT_MS:-600000}
      REQUIRE_DATABASE_ON_START: ${REQUIRE_DATABASE_ON_START:-true}
      ADMIN_USERNAME: Elite
      ADMIN_EMAIL: elite@oroactive.it
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOME: Elite
      ADMIN_COGNOME: Founder
      ADMIN_NEGOZIO: Tutti
      BACKUP_DIR: /data/oroactive/backups
      PRIVATE_UPLOAD_DIR: /app/private_uploads
      REQUIRE_PERSISTENT_UPLOAD_STORAGE: "true"
      REQUIRE_PERSISTENT_BACKUP_STORAGE: "true"
      ACADEMY_UPLOAD_DIR: /app/private_uploads/academy
      CUSTOMER_TRUST_PACK_DIR: /app/private_uploads/customer-trust-packs
    volumes:
      - oroactive-backups:/data/oroactive/backups
      - oroactive-private-uploads:/app/private_uploads
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oroactive_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obbligatoria}
      POSTGRES_DB: oroactive_db
    volumes:
      - oroactive-postgres:/var/lib/postgresql/data

volumes:
  oroactive-postgres:
  oroactive-backups:
  oroactive-private-uploads:
