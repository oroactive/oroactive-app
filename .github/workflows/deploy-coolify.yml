name: Materialize OroActive update

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: oroactive-materialize-main
  cancel-in-progress: false

jobs:
  materialize:
    if: contains(github.event.head_commit.message, '[codex-materialize]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize verified update
        shell: bash
        run: |
          set -euo pipefail
          cat .codex-upload/patch-*.b64 | base64 --decode | gzip --decompress > "${RUNNER_TEMP}/oroactive.patch"
          git apply --check "${RUNNER_TEMP}/oroactive.patch"
          git apply --binary "${RUNNER_TEMP}/oroactive.patch"
          rm -rf .codex-upload
          git add -A
          git diff --cached --check
          git config user.name "OroActive Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Materialize OroActive update"
          git push origin HEAD:main
